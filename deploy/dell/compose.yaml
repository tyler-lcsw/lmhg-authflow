services:
  authorization-manager:
    build:
      context: ../..
      args:
        VCS_REF: ${AUTH_FORMS_VCS_REF:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      AUTH_FORMS_API_TOKEN_FILE: /run/secrets/auth_manager_api_token
      AUTH_FORMS_DELETIONS_ENABLED: ${AUTH_FORMS_DELETIONS_ENABLED:-0}
      DB_PATH: /data/database.sqlite
      AUTH_FORMS_UPLOAD_DIR: /data/uploads
      AUTH_FORMS_OUTPUT_DIR: /data/output
      AUTH_FORMS_TRACE_LOG: /data/logs/auth-forms-trace.log
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - /srv/primary/services/authorization-manager/data:/data
      # Docker Compose file secrets ignore uid/gid/mode for local files; keep
      # the host file owned by UID 1000 with mode 0400.
      - /srv/primary/services/authorization-manager/secrets/api-token:/run/secrets/auth_manager_api_token:ro
